<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>TT 守护</title>
<!-- KernelSU 管理器里本模块的界面。全部内联，不联网；命令都经 ksu.exec 调 ui.sh（root）。
     在普通浏览器里打开时没有 ksu，用演示数据，方便看样子。 -->
<style>
:root {
  --bg: #f5f3ee; --surface: #fffefb; --surface-2: #f0ede6; --text: #1f1e1b; --muted: #6d6a63; --faint: #9a968d;
  --line: #e6e2d9; --accent: #2d6a58; --accent-ink: #ffffff; --accent-soft: #e2eee8; --accent-line: #b9d6c9;
  --warn: #a8620c; --warn-soft: #fbf0dc; --warn-line: #efd3a4; --danger: #b3261e; --danger-soft: #fbe5e2; --danger-line: #f0bdb7;
  --chart: #2d6a58; --chart-2: #c9a36b; --shadow: 0 1px 2px rgba(40, 35, 25, .05), 0 4px 16px rgba(40, 35, 25, .05);
  --radius: 18px; --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111312; --surface: #1a1d1b; --surface-2: #222623; --text: #ecebe5; --muted: #a09e96; --faint: #75736c;
    --line: #2b302d; --accent: #7fc6aa; --accent-ink: #0f1a15; --accent-soft: #1d2d26; --accent-line: #2f4d40;
    --warn: #f0b25a; --warn-soft: #2f2517; --warn-line: #54401f; --danger: #f28b80; --danger-soft: #361e1c; --danger-line: #5a2d29;
    --chart: #7fc6aa; --chart-2: #d6b27a; --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 15px/1.55 -apple-system, "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", system-ui, sans-serif;
  padding: max(16px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 560px; margin: 0 auto; }
button { font: inherit; color: inherit; }

/* 顶部 */
.top { display: flex; align-items: center; gap: 12px; margin: 4px 2px 18px; }
.mark { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); flex: none; }
.mark svg { width: 22px; height: 22px; }
.top h1 { font-size: 20px; line-height: 1.2; margin: 0; letter-spacing: .01em; }
.top p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.top .spacer { flex: 1; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.iconbtn svg { width: 18px; height: 18px; color: var(--muted); }
.iconbtn.spin svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 总览 */
.hero { border-radius: 24px; padding: 20px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); }
.verdict { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); flex: none; }
.hero.warn .dot { background: var(--warn); box-shadow: 0 0 0 5px var(--warn-soft); }
.hero.bad .dot { background: var(--danger); box-shadow: 0 0 0 5px var(--danger-soft); }
.verdict small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: auto; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.metric { background: var(--surface-2); border-radius: 14px; padding: 12px; min-width: 0; }
.metric .k { font-size: 12px; color: var(--muted); }
.metric .v { font-size: 17px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric .s { font-size: 12px; color: var(--faint); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric.ok .s { color: var(--accent); }
.metric.warn .v, .metric.warn .s { color: var(--warn); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.btn { min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:active:not(:disabled) { transform: scale(.98); }

/* 提醒 */
.alerts { display: grid; gap: 8px; margin-top: 14px; }
.alerts:empty { display: none; }
.alert { display: flex; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--warn-soft); border: 1px solid var(--warn-line); font-size: 14px; }
.alert.bad { background: var(--danger-soft); border-color: var(--danger-line); }
.alert.info { background: var(--accent-soft); border-color: var(--accent-line); }
.alert svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--warn); }
.alert.bad svg { color: var(--danger); } .alert.info svg { color: var(--accent); }
.alert b { display: block; font-weight: 600; }
.alert span { color: var(--muted); font-size: 13px; }

/* 卡片 */
.section { margin-top: 26px; }
.section > h2 { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .06em; margin: 0 4px 10px; display: flex; align-items: baseline; gap: 8px; }
.section > h2 .aside { margin-left: auto; font-weight: 400; letter-spacing: 0; color: var(--faint); font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; min-height: 52px; }
.row + .row { border-top: 1px solid var(--line); }
.row .main { flex: 1; min-width: 0; }
.row .title { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.row .end { color: var(--muted); font-size: 13px; text-align: right; flex: none; }
.row.tap { cursor: pointer; }
.row.tap:active { background: var(--surface-2); }
.chev { width: 16px; height: 16px; color: var(--faint); flex: none; }
.chip { display: inline-block; font-size: 11.5px; line-height: 20px; padding: 0 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 600; margin-right: 6px; vertical-align: 1px; }
.chip.new { background: var(--accent-soft); color: var(--accent); }
.ok-ic { color: var(--accent); } .warn-ic { color: var(--warn); }
.empty { padding: 22px 16px; color: var(--muted); text-align: center; font-size: 14px; }
.more { width: 100%; border: 0; border-top: 1px solid var(--line); background: none; padding: 12px; color: var(--accent); font-weight: 600; cursor: pointer; }

/* 保活小格 */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); }
.tile { background: var(--surface); padding: 14px 16px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 15px; font-weight: 600; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
.tile .v i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.tile.warn .v i { background: var(--warn); } .tile.bad .v i { background: var(--danger); } .tile.idle .v i { background: var(--faint); }

/* 图表 */
.chart { padding: 16px 16px 12px; }
.chart svg { display: block; width: 100%; height: 150px; }
.chart .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.chart .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
.stats div { padding: 12px 8px; text-align: center; }
.stats div + div { border-left: 1px solid var(--line); }
.stats b { display: block; font-size: 18px; }
.stats span { font-size: 11.5px; color: var(--muted); }

/* 空间 */
.bar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin: 14px 16px 10px; }
.bar i { display: block; height: 100%; }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; padding: 0 16px 14px; font-size: 13px; }
.keys div { display: flex; align-items: center; gap: 8px; color: var(--muted); white-space: nowrap; min-width: 0; }
.keys b { margin-left: auto; color: var(--text); font-weight: 600; }
.keys i { width: 10px; height: 10px; border-radius: 3px; flex: none; }

/* 开关 */
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; flex: none; }
.stepper button { width: 38px; height: 36px; border: 0; background: var(--surface-2); font-size: 18px; cursor: pointer; color: var(--text); }
.stepper output { min-width: 52px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 14px; }

/* 日志 */
.log { font: 12px/1.6 var(--mono); padding: 12px 16px; max-height: 340px; overflow: auto; white-space: pre-wrap; word-break: break-all; color: var(--muted); }
.log .t { color: var(--faint); }
.log .hl { color: var(--text); }

.foot { text-align: center; color: var(--faint); font-size: 12px; margin-top: 30px; line-height: 1.8; }

/* 底部弹层 */
.scrim { position: fixed; inset: 0; background: rgba(15, 14, 12, .45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.2,1); max-height: 88vh; overflow: auto; max-width: 600px; margin: 0 auto; }
.open .scrim { opacity: 1; pointer-events: auto; }
.open .sheet { transform: none; }
.grab { width: 38px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 14px; }
.sheet h3 { margin: 0 0 4px; font-size: 19px; }
.sheet .lead { color: var(--muted); margin: 0 0 14px; font-size: 14px; word-break: break-all; }
.steps { margin: 0 0 16px; padding: 0; list-style: none; display: grid; gap: 10px; }
.steps li { display: flex; gap: 10px; font-size: 14px; }
.steps li svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--accent); }
.sheet .btns { display: grid; gap: 10px; }
.result { border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; white-space: pre-wrap; }
.result.ok { background: var(--accent-soft); } .result.bad { background: var(--danger-soft); } .result.warn { background: var(--warn-soft); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: .2s; z-index: 20; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.skeleton { color: transparent !important; background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 6px; }
@keyframes sh { to { background-position: -200% 0; } }
.demo { text-align: center; font-size: 12px; color: var(--warn); margin: -8px 0 12px; }
.btn { white-space: nowrap; }
/* 小屏（360 以下）：三个小格改成一行一个，两个按钮上下排 */
@media (max-width: 380px) {
  body { padding-left: 12px; padding-right: 12px; }
  .hero { padding: 16px; }
  .metrics { grid-template-columns: 1fr; gap: 6px; }
  .metric { display: grid; grid-template-columns: auto 1fr; align-items: baseline; column-gap: 12px; padding: 10px 12px; }
  .metric .k { grid-row: span 2; align-self: center; min-width: 5.5em; }
  .metric .v { font-size: 16px; margin: 0; text-align: right; }
  .metric .s { text-align: right; }
  .actions { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr 1fr; }
  .stats b { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
    </div>
    <div>
      <h1>TT 守护</h1>
      <p>TauriTavern 保活 · 备份</p>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="refresh" aria-label="刷新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </header>
  <div class="demo" id="demo" hidden>这是演示数据：在 KernelSU 管理器里打开本模块才是你手机上的真实状态</div>

  <section class="hero" id="hero">
    <div class="verdict"><span class="dot"></span><span id="verdict" class="skeleton">正在读取状态</span><small id="updated"></small></div>
    <div class="metrics">
      <div class="metric" id="m-backup"><div class="k">最近备份</div><div class="v skeleton">——</div><div class="s">&nbsp;</div></div>
      <div class="metric" id="m-mac"><div class="k">拷到电脑</div><div class="v skeleton">——</div><div class="s">&nbsp;</div></div>
      <div class="metric" id="m-tt"><div class="k">TauriTavern</div><div class="v skeleton">——</div><div class="s">&nbsp;</div></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="btn-backup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        立即备份
      </button>
      <button class="btn" id="btn-restore">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
        从备份恢复
      </button>
    </div>
    <div class="alerts" id="alerts"></div>
  </section>

  <section class="section">
    <h2>备份 <span class="aside" id="backup-aside"></span></h2>
    <div class="card" id="backups"><div class="empty skeleton">读取中</div></div>
  </section>

  <section class="section">
    <h2>保活状态</h2>
    <div class="card"><div class="grid" id="keep"></div></div>
  </section>

  <section class="section">
    <h2>最近 7 天 <span class="aside">每天生成回复的时长</span></h2>
    <div class="card">
      <div class="chart"><svg id="chart" role="img" aria-label="最近 7 天每天生成回复的分钟数"></svg>
        <div class="legend"><span><i style="background:var(--chart)"></i>生成时长（分钟）</span><span><i style="background:var(--chart-2)"></i>当天被冻结过</span></div>
      </div>
      <div class="stats" id="today"></div>
    </div>
  </section>

  <section class="section">
    <h2>TT 为什么停过 <span class="aside">最近 7 天</span></h2>
    <div class="card" id="reasons"></div>
  </section>

  <section class="section">
    <h2>占用空间</h2>
    <div class="card" id="space"></div>
  </section>

  <section class="section">
    <h2>设置 <span class="aside">改了马上生效，不用重启</span></h2>
    <div class="card" id="settings"></div>
  </section>

  <section class="section">
    <h2>日志 <span class="aside">新的在上</span></h2>
    <div class="card"><div class="log" id="log"></div></div>
  </section>

  <p class="foot" id="foot">不联网 · 备份只在你的手机和电脑上 · API 密钥不进备份</p>
</div>

<div id="sheetbox">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const MOD = "/data/adb/modules/claudemax_tt_keepalive";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const IC = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4"/><path d="M12 17.5v.5"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5v.5"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/></svg>',
};

/* ---------- 调命令（KernelSU 的 ksu.exec；没有就用演示数据） ---------- */
const HAS_KSU = typeof window.ksu !== "undefined" && typeof window.ksu.exec === "function";
let cbSeq = 0;
function exec(cmd) {
  return new Promise((resolve, reject) => {
    const name = `__tt_cb_${Date.now()}_${cbSeq++}`;
    window[name] = (errno, stdout, stderr) => { delete window[name]; resolve({ errno, stdout, stderr }); };
    try { window.ksu.exec(cmd, "{}", name); } catch (e) { delete window[name]; reject(e); }
  });
}
async function ui(args) {
  if (!HAS_KSU) return demo(args);
  const r = await exec(`sh ${MOD}/ui.sh ${args}`);
  try { return JSON.parse(r.stdout); } catch { throw new Error((r.stderr || r.stdout || "没有输出").slice(0, 200)); }
}
function toast(msg) {
  if (HAS_KSU && window.ksu.toast) { try { window.ksu.toast(msg); return; } catch {} }
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- 文字 ---------- */
function ago(ts, now) {
  if (!ts) return null;
  const s = Math.max(0, now - ts);
  if (s < 90) return "刚刚";
  if (s < 3600) return `${Math.round(s / 60)} 分钟前`;
  if (s < 86400 * 2) return `${Math.round(s / 3600)} 小时前`;
  return `${Math.floor(s / 86400)} 天前`;
}
const kb = (k) => k == null ? "—" : k >= 1048576 ? `${(k / 1048576).toFixed(1)} GB` : k >= 1024 ? `${(k / 1024).toFixed(1)} MB` : `${k} KB`;
const mins = (s) => s >= 3600 ? `${Math.floor(s / 3600)} 小时 ${Math.round((s % 3600) / 60)} 分` : `${Math.round(s / 60)} 分钟`;
const TIER = { new: "最新", "2d": "近两天", day: "每天", week: "每周", month: "每月", drop: "多余" };
function backupWhen(name) {
  const m = /(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/.exec(name);
  return m ? `${+m[2]} 月 ${+m[3]} 日 ${m[4]}:${m[5]}` : name;
}
const BUCKET = { 5: "豁免（最好）", 10: "活跃", 20: "常用", 30: "偶尔", 40: "很少", 45: "受限" };

/* ---------- 画 ---------- */
let S = null;
function alertsOf(d) {
  const a = [], now = d.now, c = d.config, b = d.backup;
  const since = b.check || b.last || b.watch_since;
  if (!c.backup) a.push(["bad", "自动备份关着", "在下面「设置」里打开。"]);
  else if (b.fails >= 3) a.push(["bad", `备份连续失败 ${b.fails} 次`, "先看看手机存储空间够不够；也可以点「立即备份」看报什么错。"]);
  else if (since && now - since > 172800) a.push(["bad", `已经 ${Math.floor((now - since) / 86400)} 天没备份成功`, "手机开机后要解锁一次，备份才会开始。"]);
  else if (!b.items.length) a.push(["warn", "还没有备份", "点「立即备份」马上做一份。"]);
  const mp = b.mac_pulled || b.watch_since;
  if (c.mac_alert_days && b.items.length && mp && now - mp > c.mac_alert_days * 86400)
    a.push(["warn", b.mac_pulled ? `${Math.floor((now - mp) / 86400)} 天没拷到电脑` : "备份还没拷到过电脑", "手机丢了或坏了，只在手机上的备份也会没。连上电脑（数据线或无线调试），电脑会自动拷。"]);
  if (d.tt.installed && !d.keep.whitelist) a.push(["warn", "TT 不在电池优化白名单里", "模块 10 分钟内会自动补上。"]);
  if (d.tt.running && d.keep.network && d.keep.network !== "NONE") a.push(["warn", "TT 的网络被系统限制了", `限制：${d.keep.network}`]);
  if (d.keep.temp != null && c.temp_alert && d.keep.temp >= c.temp_alert) a.push(["warn", `手机有点烫：${d.keep.temp}°C`, "放下歇一会儿，别边充电边用。"]);
  if (d.crashes) a.push(["info", `存着 ${d.crashes} 份崩溃记录`, "电脑上的「安卓保活模块」菜单会拷回电脑，方便查原因。"]);
  if (!d.tt.installed) a.push(["bad", "没找到 TauriTavern", "装上 TT 后模块会自动开始工作。"]);
  return a;
}

let showAll = false;

function metric(sel, v, s, cls) {
  const el = $(sel); el.className = "metric " + (cls || "");
  el.querySelector(".v").classList.remove("skeleton");
  el.querySelector(".v").textContent = v; el.querySelector(".s").textContent = s || "\u00a0";
}

function drawChart(days) {
  const svg = $("#chart"), W = 320, H = 150, pad = { l: 26, r: 6, t: 14, b: 22 };
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const data = (days || []).slice(-7);
  if (!data.length) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" fill="var(--muted)" font-size="12">用一阵 TT 之后这里会有图</text>`; return; }
  const vals = data.map((r) => r[2] / 60), max = Math.max(10, ...vals);
  const nice = max <= 10 ? 10 : max <= 30 ? 30 : max <= 60 ? 60 : max <= 120 ? 120 : Math.ceil(max / 60) * 60;
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b, bw = Math.min(28, iw / data.length * .56);
  let g = "";
  [0, .5, 1].forEach((f) => {
    const y = pad.t + ih * (1 - f);
    g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${pad.l - 6}" y="${y + 3.5}" text-anchor="end" fill="var(--faint)" font-size="9.5">${Math.round(nice * f)}</text>`;
  });
  data.forEach((r, i) => {
    const cx = pad.l + iw * (i + .5) / data.length, h = Math.max(vals[i] > 0 ? 2 : 0, ih * vals[i] / nice);
    g += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${(pad.t + ih - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="var(--chart)"><title>${r[0]}：${Math.round(vals[i])} 分钟，${r[1]} 次</title></rect>`;
    if (r[3] > 0) g += `<circle cx="${cx.toFixed(1)}" cy="${(pad.t + ih - h - 7).toFixed(1)}" r="3" fill="var(--chart-2)"><title>被冻结 ${r[3]} 次</title></circle>`;
    g += `<text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle" fill="var(--muted)" font-size="10">${r[0].replace("-", "/")}</text>`;
  });
  svg.innerHTML = g;
}

  ["notify", "出事时发通知", "关掉的话只记日志"],
];
const STEPS = [
  ["backup_hours", "备份间隔", "有变化时最多每几小时一次", 1, 48, (v) => `${v} 小时`],
  ["keep_days", "按天保留", "每天留最新的一份", 1, 60, (v) => `${v} 天`],
  ["keep_weeks", "按周保留", "每周留最新的一份", 0, 52, (v) => `${v} 周`],
  ["keep_months", "按月保留", "每月留最新的一份", 0, 36, (v) => `${v} 个月`],
  ["mac_alert_days", "没拷到电脑时提醒", "0 = 不提醒", 0, 30, (v) => v ? `${v} 天` : "不提醒"],
  ["cleanup_days", "清理 TT 旧日志", "0 = 不清理", 0, 365, (v) => v ? `${v} 天前` : "不清理"],
  ["temp_alert", "过热提醒", "生成回复时电池温度", 0, 60, (v) => v ? `${v}°C` : "不提醒"],
];
function renderSettings(c) {
  $("#settings").innerHTML =
    TOGGLES.map(([k, t, s]) => `<div class="row"><div class="main"><div class="title">${t}</div><div class="sub">${s}</div></div>
      <label class="switch"><input type="checkbox" data-key="${k}" ${c[k] ? "checked" : ""} aria-label="${t}"><span></span></label></div>`).join("") +
    STEPS.map(([k, t, s, lo, hi, fmt]) => `<div class="row"><div class="main"><div class="title">${t}</div><div class="sub">${s}</div></div>
      <div class="stepper" data-key="${k}" data-lo="${lo}" data-hi="${hi}"><button aria-label="减少">−</button><output>${fmt(c[k] ?? 0)}</output><button aria-label="增加">+</button></div></div>`).join("");
  document.querySelectorAll("#settings input[data-key]").forEach((el) => el.onchange = () => setKey(el.dataset.key, el.checked ? 1 : 0, el));
  document.querySelectorAll("#settings .stepper").forEach((el) => {
    const [minus, , plus] = el.children, key = el.dataset.key, lo = +el.dataset.lo, hi = +el.dataset.hi;
    const step = (dlt) => { const cur = S.config[key] ?? 0, nv = Math.min(hi, Math.max(lo, cur + dlt)); if (nv !== cur) setKey(key, nv); };
    minus.onclick = () => step(-1); plus.onclick = () => step(+1);
  });
}
async function setKey(key, val, input) {
  const old = S.config[key]; S.config[key] = val; renderSettings(S.config);
  try {
    const r = await ui(`set ${key} ${val | 0}`);
    if (!r.ok) throw new Error(r.msg);
    if (key === "backup_private") { toast(val ? "备份搬到私密位置了" : "备份搬到「内部存储/Documents/TauriTavern-backup」了"); load(); }
  } catch (e) { S.config[key] = old; renderSettings(S.config); toast("没改成：" + e.message); }
}

  if (args === "backup") { st.backup.items.unshift({ name: stamp(st.now), tier: "new", kb: 45410, verified: true }); st.backup.items[1].tier = "2d"; st.backup.last = st.now; return wait({ ok: true, name: st.backup.items[0].name, kb: 45410, dropped: 0 }); }
  if (args.startsWith("set ")) { const [, k, v] = args.split(" "); st.config[k] = +v; return wait({ ok: true }); }
  if (args.startsWith("restore ")) return wait(st.tt.running ? { rc: 3, out: ["TT 正在运行：先在最近任务里把 TT 划掉，再恢复"] } : { rc: 0, out: ["已恢复：" + args.slice(8), "恢复前的数据另存为：" + stamp(st.now) + "（同一个文件夹，想撤销就恢复它）"] });
  return wait({});
}
if (!HAS_KSU) { $("#demo").hidden = false; window.__demoToggleRunning = () => { demo.state.tt.running = !demo.state.tt.running; }; }
load();
</script>
