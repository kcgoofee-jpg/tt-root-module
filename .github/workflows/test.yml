name: test
on: [push, pull_request, workflow_dispatch]
env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/run.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: pull-backups.ps1 on Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\win-cases.ps1
